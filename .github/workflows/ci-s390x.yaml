name: Scala 3 s390x

# Run on pushes to the s390x branch and on manual triggers.
on:
  push:
    branches:
      - 's390x'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/s390x' }}

jobs:

  compiler-tests:
    uses: ./.github/workflows/compiler-tests-s390x.yaml

  stdlib-tests:
    uses: ./.github/workflows/stdlib-s390x.yaml

  misc-tests:
    uses: ./.github/workflows/misc-tests-s390x.yaml
